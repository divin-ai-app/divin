# cPanel Git Version Control deploy tasks.
#
# Setup (one-time, in cPanel):
#   1. Git Version Control → clone/pull this repo to e.g. ~/divin-ai (a
#      folder OUTSIDE public_html — Laravel's real webroot is the app's own
#      public/ subfolder, never the app root).
#   2. Domains → set this domain/subdomain's Document Root to
#      ~/divin-ai/public (cPanel lets you pick a custom document root when
#      creating/editing a domain). If your plan can't set a custom document
#      root, the fallback is to point public_html's index.php at
#      ../divin-ai/public/index.php and symlink/copy the rest of public/'s
#      contents into public_html instead.
#   3. Copy .env.example to ~/divin-ai/.env, fill in real DB/Resend/Stripe
#      credentials, then `php artisan key:generate` once by hand.
#   4. Push to the deployed branch (or click "Deploy HEAD Commit") to run
#      this file.
#
# No Node on this host: compiled Vite/Tailwind assets in public/build are
# committed to git (see .gitignore) and must be rebuilt locally with
# `npm run build` before every push that changes resources/css or
# resources/js — this deploy step does not (and cannot) run `npm run build`.

---
deployment:
  tasks:
    - /bin/echo "Installing PHP dependencies..."
    - composer install --no-dev --optimize-autoloader --no-interaction
    - /bin/echo "Running migrations..."
    - php artisan migrate --force
    - /bin/echo "Ensuring storage symlink exists..."
    - php artisan storage:link || true
    - /bin/echo "Caching config/routes/views..."
    - php artisan config:cache
    - php artisan route:cache
    - php artisan view:cache
    - php artisan event:cache
    - /bin/echo "Deploy complete."
