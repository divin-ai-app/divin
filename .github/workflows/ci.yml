name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: divinai_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=5s
          --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      APP_KEY: base64:w4NSwjuBvBkJ0KLb9vjV+9us6cf1vNT/mtJb3+9iSuQ=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: divinai_ci
      DB_USERNAME: root
      DB_PASSWORD:
      MAIL_MAILER: log
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, bcmath, intl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Lint (Pint)
        run: vendor/bin/pint --test

      - name: Run migrations
        run: php artisan migrate --force

      - name: Unit/Feature tests
        run: php artisan test

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install Node dependencies (build-time only, see .cpanel.yml)
        run: npm ci

      - name: Build assets
        run: npm run build
