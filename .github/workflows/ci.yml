name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    env:
      # next build only needs a syntactically valid schema + client (Prisma's
      # generate step doesn't touch a live DB). Route handlers/pages that
      # query the DB at build time would need a real service container —
      # add one here (mysql:8) once Phase 2+ introduces those.
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/divinai_ci"
      AUTH_SECRET: "ci-only-secret-not-used-for-anything-real"
      AUTH_URL: "http://localhost:3000"
      EMAIL_SERVER_HOST: "127.0.0.1"
      EMAIL_SERVER_PORT: "1025"
      EMAIL_FROM: "divin.ai <no-reply@divin.ai>"
      STRIPE_SECRET_KEY: "sk_test_ci_placeholder"
      STRIPE_WEBHOOK_SECRET: "whsec_ci_placeholder"
      STRIPE_PRICE_ID_REGISTERED: "price_ci_placeholder"
      STRIPE_PRICE_ID_MANAGED: "price_ci_placeholder"
      INGESTION_API_KEY: "ci-placeholder"
      CRON_SECRET: "ci-placeholder"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
